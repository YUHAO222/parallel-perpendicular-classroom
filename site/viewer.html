<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/>
<title>《平行与垂直》课堂 PPT</title>
<style>
  html,body{margin:0;height:100%;background:#070b14;overflow:hidden;
    font-family:"Microsoft YaHei",system-ui,sans-serif;color:#e8eefb;}
  #stage{position:absolute;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  #stage img{max-width:96%;max-height:96%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.7);}
  #stage iframe{width:98%;height:98%;border:0;border-radius:10px;background:#0b1220;
    box-shadow:0 20px 60px rgba(0,0,0,.7);}
  #bar{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:12px;
    padding:0 16px;background:rgba(12,18,32,.96);border-top:1px solid rgba(255,255,255,.12);}
  #bar button{cursor:pointer;background:rgba(255,255,255,.08);color:#dbe6f7;border:1px solid rgba(255,255,255,.2);
    border-radius:8px;padding:6px 14px;font-size:14px;}
  #bar button:hover{background:rgba(255,255,255,.2);}
  #bar .t{font-size:14px;font-weight:700;color:#ffd88a;letter-spacing:1px;}
  #bar .p{font-size:13px;color:#9fb0cc;min-width:74px;text-align:center;}
  #bar .s{font-size:12.5px;color:#ffd88a;min-width:96px;}
  #bar .g{flex:1;}
  #tip{position:fixed;left:50%;top:10px;transform:translateX(-50%);font-size:12px;color:#8ea0c4;
    background:rgba(0,0,0,.45);padding:4px 14px;border-radius:999px;}
</style></head>
<body>
  <div id="stage"><img id="img" alt="PPT 页面"/></div>
  <div id="bar">
    <span class="t">《平行与垂直》课堂 PPT（冯晴老师课件 28 页 + 精确图 15 张）</span>
    <button id="prev">◀ 上一句</button><span class="p" id="page"></span>
    <button id="next">▶ 下一句</button><button id="skip" style="display:none">⏭ 跳页</button>
    <span class="s" id="step"></span>
    <button id="full">全屏</button>
    <span class="g"></span><span id="name" style="font-size:12px;color:#8ea0c4"></span>
  </div>
  <div id="tip">← → / 空格：先逐句出现、本页出完再翻页 · 点画面右半边同 ▶ · F 全屏</div>
<script src="reveals.js?v=20261018"></script>
<script>
const DECK=[
 /* 冯晴老师课件（导出的 28 页），第 17 页换成可点击互动版 */
 "deck/cq01.png","deck/cq02.png","deck/cq03.png","deck/cq04.png","deck/cq05.png","deck/cq06.png",
 "deck/cq07.png","deck/cq08.png","deck/cq09.png","deck/cq10.png","deck/cq11.png","deck/cq12.png",
 "deck/cq13.png","deck/cq14.png","deck/cq15.png","deck/cq16.png",
 "deck/p17_angles.html",
 "deck/cq18.png","deck/cq19.png","deck/cq20.png","deck/cq21.png","deck/cq22.png","deck/cq23.png",
 "deck/cq24.png","deck/cq25.png","deck/cq26.png","deck/cq27.png","deck/cq28.png",
 /* 课堂用的精确图（直角符号 a∥b a⊥b 垂足 学生作品 思维导图） */
 "slides/00_封面.png","slides/01_环节二_判断练习.png","slides/02_环节五_第一题.png",
 "slides/03_环节五_第二题_判断.png","slides/04_环节五_第三题_迷宫.png","slides/05_环节六_思维导图.png",
 "slides/06_学生作品_手画直线.png","slides/07_学生作品_编号1.png","slides/08_学生作品_编号2.png",
 "slides/09_学生作品_编号3.png","slides/10_判断练习_答案一.png","slides/11_判断练习_答案二.png",
 "slides/12_第一题_答案一.png","slides/13_第一题_答案二.png","slides/14_迷宫作品_几何大冒险.png"];
let i=0, step=0;
const stage=document.getElementById('stage'),img=document.getElementById('img');
function isHtml(p){ return /\.html?($|\?|#)/i.test(p||''); }
function frames(p){ return (window.REVEALS||{})[p]||null; }
function render(){
  const src=DECK[i], fr=frames(src), f=document.getElementById('frame');
  if(isHtml(src)){
    step=0;
    img.style.display='none';
    if(f){ f.setAttribute('src',src); f.style.display=''; }
    else { const nf=document.createElement('iframe'); nf.id='frame'; nf.setAttribute('src',src);
      stage.appendChild(nf); }
  } else {
    if(f) f.style.display='none';
    img.style.display=''; img.src = fr ? fr[step] : src;
    if(fr) fr.forEach(s=>{ const im=new Image(); im.src=s; });
  }
  document.getElementById('page').textContent=(i+1)+' / '+DECK.length;
  document.getElementById('step').textContent = fr
    ? ('单击 '+step+'/'+Math.max(1,fr.length-1)+(step<fr.length-1?'（还剩 '+(fr.length-1-step)+' 次）':'（已出完）'))
    : '';
  document.getElementById('name').textContent=src.split('/').pop().replace(/\.(png|html?)$/,'');
  document.getElementById('prev').disabled=(i===0 && step===0);
  document.getElementById('next').disabled=(i===DECK.length-1 && !(fr&&step<fr.length-1));
  document.getElementById('skip').style.display=(fr&&fr.length>2)?'':'none';
}
function show(n, dir){
  i=Math.max(0,Math.min(DECK.length-1,n));
  const fr=frames(DECK[i]);
  step = (dir<0 && fr) ? fr.length-1 : 0;
  render();
}
function advance(){
  const fr=frames(DECK[i]);
  if(fr && step<fr.length-1){ step++; render(); return; }
  show(i+1, 1);
}
function back(){
  const fr=frames(DECK[i]);
  if(fr && step>0){ step--; render(); return; }
  show(i-1, -1);
}
document.getElementById('prev').onclick=e=>{e.stopPropagation();back();};
document.getElementById('next').onclick=e=>{e.stopPropagation();advance();};
document.getElementById('skip').onclick=e=>{e.stopPropagation();show(i+1,1);};
document.getElementById('full').onclick=e=>{
  e.stopPropagation();
  if(document.fullscreenElement){document.exitFullscreen();}
  else{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
};
stage.onclick=e=>{ if(isHtml(DECK[i])) return;            // 互动页自己处理点击
  const r=stage.getBoundingClientRect();
  if(e.clientX < r.left+r.width/2) back(); else advance();};
window.addEventListener('wheel',e=>{ if(e.deltaY>0) advance(); else back(); },{passive:true});
window.addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){advance();e.preventDefault();}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){back();e.preventDefault();}
  else if(e.key==='Home'){show(0,1);} else if(e.key==='End'){show(DECK.length-1,1);}
  else if(e.key==='f'||e.key==='F'){document.getElementById('full').click();}
});
const st=new URLSearchParams(location.search).get('start');
show(st ? Math.max(0, DECK.findIndex(x=>x.split('/').pop()===st)) : 0, 1);
</script></body></html>
