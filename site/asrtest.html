<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>asr-start</title></head>
<body><div id="log">start</div>
<script src="asr/vosk.js"></script>
<script>
function report(s){ document.title=s; var l=document.getElementById('log'); if(l) l.textContent=s; }
report('js:'+(typeof Vosk));
report('fetching...');
fetch('asr/model.tar.gz').then(function(r){
  report('RESP:'+r.status);
  return r.arrayBuffer();
}).then(function(b){
  report('FETCH_OK:'+b.byteLength);
  try{
    var url=URL.createObjectURL(new Blob([b]));
    Vosk.createModel(url).then(function(m){ report('MODEL_OK_blob'); })
      .catch(function(e){ report('MODEL_ERR_blob:'+((e&&e.message)||e)); });
  }catch(e){ report('BLOB_ERR:'+((e&&e.message)||e)); }
}).catch(function(e){ report('FETCH_ERR:'+((e&&e.message)||e)); });
</script>
</body></html>
