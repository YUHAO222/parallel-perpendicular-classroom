<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>平行与垂直 · 双智能体课堂</title>
<style>
  :root{
    --wk:#ffb020; --bj:#5fb8ff; --both:#ffe9a8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#000;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#fff;}
  body{user-select:none;}

  /* ===== 整屏视频 ===== */
  .screen{position:fixed;inset:0;background:#000;overflow:hidden;}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}

  header{position:fixed;top:0;left:0;right:0;z-index:20;text-align:center;padding:18px 16px 0;
    pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent);}
  header h1{font-size:clamp(20px,2.8vw,34px);letter-spacing:5px;font-weight:800;
    background:linear-gradient(90deg,var(--wk),#ffe9a8,var(--bj));
    -webkit-background-clip:text;background-clip:text;color:transparent;}

  .micstate{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:21;
    display:flex;align-items:center;gap:8px;font-size:13px;color:#c3cfe4;
    background:rgba(0,0,0,.32);padding:5px 13px;border-radius:999px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#5b6b86;}
  .micstate.live .dot{background:#37e08a;box-shadow:0 0 12px #37e08a;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.4);opacity:.6;}}

  .speaker-tag{position:fixed;top:70px;left:22px;z-index:21;display:none;
    padding:7px 16px;border-radius:999px;font-weight:800;letter-spacing:2px;font-size:15px;
    background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);}
  .speaker-tag[data-ch="wk"]{color:var(--wk);border-color:var(--wk);}
  .speaker-tag[data-ch="bj"]{color:var(--bj);border-color:var(--bj);}
  .speaker-tag[data-ch="both"]{color:var(--both);}

  /* 字幕 */
  .subs{position:fixed;left:50%;bottom:clamp(20px,4.5vh,48px);transform:translateX(-50%);
    width:min(92vw,1100px);z-index:20;text-align:center;pointer-events:none;}
  .bubble{display:none;padding:14px 26px;border-radius:15px;line-height:1.6;
    background:rgba(8,12,24,.7);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);
    font-size:clamp(15px,1.9vw,24px);box-shadow:0 10px 26px rgba(0,0,0,.45);}
  .bubble .who{font-weight:800;margin-right:9px;}
  .bubble[data-ch="wk"] .who{color:var(--wk);}
  .bubble[data-ch="bj"] .who{color:var(--bj);}
  .bubble[data-ch="both"] .who{color:var(--both);}
  .heard{margin-top:9px;font-size:clamp(11px,1.3vw,15px);color:#9fb0cc;min-height:18px;}

  /* 开场遮罩 */
  .start{position:fixed;inset:0;z-index:60;background:rgba(6,10,20,.94);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;}
  .start h2{font-size:clamp(22px,3.6vw,40px);letter-spacing:3px;}
  .start p{color:#a9b8d2;max-width:620px;line-height:1.8;font-size:15px;}
  .btn{cursor:pointer;border:none;border-radius:999px;padding:15px 44px;font-size:19px;font-weight:800;letter-spacing:2px;color:#1a1206;
    background:linear-gradient(90deg,var(--wk),#ffd76b);box-shadow:0 10px 30px rgba(255,180,40,.4);transition:transform .2s;}
  .btn:active{transform:scale(.96);}
  .nospeech{color:#ff9c7a;font-size:13px;max-width:540px;line-height:1.7;}

  /* ===== 教师控制台（可收起，投屏时几乎不可见）===== */
  .panel-toggle{position:fixed;right:14px;bottom:14px;z-index:45;cursor:pointer;
    width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
    background:rgba(14,22,40,.78);backdrop-filter:blur(6px);color:#dbe6f7;font-size:20px;}
  .panel{position:fixed;right:14px;bottom:70px;z-index:44;width:min(360px,86vw);max-height:74vh;
    display:none;flex-direction:column;gap:8px;overflow:hidden;
    background:rgba(10,16,30,.86);border:1px solid rgba(255,255,255,.14);border-radius:16px;backdrop-filter:blur(10px);}
  .panel.open{display:flex;}
  .panel .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(255,255,.1);}
  .panel .bar b{font-size:14px;letter-spacing:1px;}
  .panel .bar .idlebtn{cursor:pointer;font-size:12px;color:#cdd8ea;border:1px solid rgba(255,255,255,.2);
    padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);}
  .scroll{overflow:auto;padding:6px 10px 12px;display:flex;flex-direction:column;gap:10px;}
  .seg-grp{display:flex;flex-direction:column;gap:5px;}
  .seg-label{font-size:12px;color:#9fb0d0;letter-spacing:1px;padding:2px 4px;position:sticky;top:0;
    background:rgba(10,16,30,.9);padding:4px;}
  .seg-grp button{cursor:pointer;text-align:left;border:1px solid rgba(255,255,255,.12);color:#e6edf8;
    background:rgba(255,255,255,.05);border-radius:9px;padding:8px 11px;font-size:12.5px;line-height:1.4;}
  .seg-grp button:active{transform:scale(.98);}
  .seg-grp button.wk{border-left:3px solid var(--wk);}
  .seg-grp button.bj{border-left:3px solid var(--bj);}
  .seg-grp button.both{border-left:3px solid var(--both);}
  .seg-grp button .k{display:block;color:#8fa0c6;font-size:11px;margin-top:2px;}

  /* ===== 课件（PPT 弹窗）===== */
  #pptWin{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);z-index:40;display:none;
    flex-direction:column;width:min(1080px,88vw);height:min(710px,80vh);min-width:400px;min-height:260px;
    resize:both;overflow:hidden;border-radius:14px;border:1px solid rgba(255,255,255,.16);
    background:#0b1220;box-shadow:0 26px 80px rgba(0,0,0,.72);}
  #pptWin.show{display:flex;}
  .pptbar{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:move;user-select:none;
    background:linear-gradient(180deg,rgba(255,176,32,.22),rgba(255,176,32,.05));
    border-bottom:1px solid rgba(255,255,255,.12);}
  .pptbar b{font-size:14px;letter-spacing:1px;color:#ffd88a;white-space:nowrap;}
  .pptbar .pg{font-size:12px;color:#9fb0cc;white-space:nowrap;}
  .pptbar .grow{flex:1;}
  .pptbar button{cursor:pointer;background:rgba(255,255,255,.08);color:#dbe6f7;border:1px solid rgba(255,255,255,.18);
    border-radius:8px;padding:3px 10px;font-size:13px;line-height:1.5;}
  .pptbar button:hover{background:rgba(255,255,255,.2);}
  #pptWin .pptbody{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:6px;
    background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.06),transparent 70%);}
  #pptWin .pptbody img{max-width:100%;max-height:100%;border-radius:8px;}
  #pptWin .ppthint{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:12px;color:#8ea0c4;
    padding:3px;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent);pointer-events:none;}
  .slide-badge{position:fixed;top:70px;right:22px;z-index:41;display:none;padding:6px 14px;border-radius:999px;
    background:rgba(255,176,32,.16);border:1px solid var(--wk);color:var(--wk);font-size:13px;letter-spacing:1px;}
  .slide-badge.show{display:block;}
  #holdTip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:39;display:none;
    padding:6px 18px;border-radius:999px;background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.5);
    color:#ffd88a;font-size:13px;letter-spacing:1px;white-space:nowrap;}
</style>
</head>
<body>
  <div class="screen"><video id="player" src="" muted playsinline autoplay loop></video></div>

  <header><h1>平 行 与 垂 直</h1></header>
  <div class="speaker-tag" id="speakerTag"></div>
  <div class="micstate" id="micstate"><span class="dot"></span><span id="mictxt">语音未启动</span></div>

  <div class="subs">
    <div class="bubble" id="bubble"><span class="who" id="who"></span><span id="reply"></span></div>
    <div class="heard" id="heard"></div>
  </div>

  <div class="slide-badge" id="slideBadge" title="点击可再次调出课件">课件</div>
  <div id="pptWin">
    <div class="pptbar" id="pptBar">
      <b id="pptName">课件</b><span class="pg" id="pptPage"></span><span class="grow"></span>
      <button id="pptPrev" title="上一页（←）">◀</button>
      <button id="pptNext" title="下一页（→ 或空格）">▶</button>
      <button id="pptFull" title="全屏 / 还原（F）">全屏</button>
      <button id="pptPop" title="在新窗口打开完整 PPT（可拖到副屏）">新窗口</button>
      <button id="pptClose" title="收起（Esc）">✕</button>
    </div>
    <div class="pptbody" id="pptBody"><img id="pptImg" alt="课件"></div>
    <div class="ppthint">点画面下一页 · 拖标题栏移动 · 右下角拉伸 · 动画在后台继续播放</div>
  </div>

  <div id="holdTip">课件段落已停在讲解状态 · 讲完点控制台下一个节点或「返回待机」继续</div>
  <button class="panel-toggle" id="panelToggle" title="教师控制台">☰</button>
  <div class="panel" id="panel">
    <div class="bar"><b>教师控制台</b><span style="flex:1"></span><span class="idlebtn" id="openPptBtn" title="打开整套 PPT 演示窗口">PPT 演示</span><span class="idlebtn" id="goIdleBtn">返回待机</span></div>
    <div class="scroll" id="scroll"></div>
  </div>

  <div class="start" id="start">
    <h2>《平行与垂直》双智能体课堂</h2>
    <p>孙悟空负责<b>演示与追问</b>，猪八戒负责<b>出题与点评</b>。<br/>
       开启后可直接用语音口令，也可点右下角 <b>☰</b> 按教学环节手动触发。</p>
    <button class="btn" id="startBtn">进入课堂</button>
    <p class="nospeech" id="nospeech" style="display:none;">
      当前浏览器不支持离线语音识别（需 Chrome/Edge）。不影响使用：请用右下角控制台按环节点击播放。
    </p>
  </div>

<script src="dialogues.js"></script>
<script>
const CFG=window.DIALOGUES;
const player=document.getElementById('player');
const bubble=document.getElementById('bubble'),whoEl=document.getElementById('who'),
      replyEl=document.getElementById('reply'),heardEl=document.getElementById('heard');
const speakerTag=document.getElementById('speakerTag');
const micstate=document.getElementById('micstate'),mictxt=document.getElementById('mictxt');
const CH_NAME={wk:'孙悟空',bj:'猪八戒',both:'双人'};
const SEG_NAME={1:'环节一 · AI情境导入',2:'环节二 · 相交与不相交',3:'环节三 · 同一平面',
                4:'环节四 · 垂直',5:'环节五 · 分层练习',6:'环节六 · 总结作业'};
let playing=false, started=false, recog=null;

let slideList=[], slideIdx=0, slideName='课件', curImg='';

function showSlides(list, name){
  list=(list||[]).filter(Boolean);
  if(!list.length){ hideSlide(); return; }
  slideList=list; slideIdx=0;
  if(name) slideName=name;
  document.getElementById('pptName').textContent=slideName;
  document.getElementById('pptWin').classList.add('show');
  document.getElementById('slideBadge').classList.add('show');
  renderSlide();
  keepPlaying();
}
/* 弹课件时不让动画/配音停：只要在播流程中就续播 */
function keepPlaying(){
  try{
    if(typeof player!=='undefined' && player && player.paused && player.getAttribute('src')) player.play().catch(()=>{});
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) keepPlaying(); });
function renderSlide(){
  curImg=slideList[slideIdx]||'';
  document.getElementById('pptImg').setAttribute('src',curImg);
  document.getElementById('pptPage').textContent =
    slideList.length>1 ? ((slideIdx+1)+' / '+slideList.length) : '';
  document.getElementById('pptPrev').disabled = (slideIdx<=0);
  document.getElementById('pptNext').disabled = (slideIdx>=slideList.length-1);
  keepPlaying();
}
function slideGo(d){
  if(!slideList.length) return;
  const n=slideIdx+d;
  if(n<0||n>=slideList.length) return;
  slideIdx=n; renderSlide();
}
function hideSlide(){
  slideList=[]; slideIdx=0; curImg='';
  document.getElementById('pptWin').classList.remove('show');
  document.getElementById('slideBadge').classList.remove('show');
}
/* 标题栏拖动 */
(function(){
  const bar=document.getElementById('pptBar'), win=document.getElementById('pptWin');
  let dx=0,dy=0,drag=false;
  bar.addEventListener('mousedown',e=>{
    if(e.target.tagName==='BUTTON') return;
    const r=win.getBoundingClientRect();
    win.style.transform='none';
    win.style.left=r.left+'px'; win.style.top=r.top+'px';
    dx=e.clientX-r.left; dy=e.clientY-r.top; drag=true; e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!drag) return;
    win.style.left=Math.max(0,Math.min(window.innerWidth-120,e.clientX-dx))+'px';
    win.style.top =Math.max(0,Math.min(window.innerHeight-60,e.clientY-dy))+'px';
  });
  window.addEventListener('mouseup',()=>drag=false);
})();
document.getElementById('pptBody').onclick=()=>slideGo(1);
document.getElementById('pptPrev').onclick=e=>{e.stopPropagation();slideGo(-1);};
document.getElementById('pptNext').onclick=e=>{e.stopPropagation();slideGo(1);};
document.getElementById('pptClose').onclick=e=>{e.stopPropagation();hideSlide();};
document.getElementById('pptFull').onclick=e=>{
  e.stopPropagation();
  const w=document.getElementById('pptWin');
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else if(w.requestFullscreen){ w.requestFullscreen().catch(()=>{}); }
};
document.getElementById('pptPop').onclick=e=>{
  e.stopPropagation();
  const u='viewer.html'+(curImg?('?start='+encodeURIComponent(curImg.split('/').pop())):'');
  window.open(u,'pptdeck','width=1280,height=780,menubar=no,toolbar=no');
};
document.getElementById('slideBadge').onclick=()=>{
  const w=document.getElementById('pptWin');
  if(slideList.length){ w.classList.toggle('show'); }
};
document.addEventListener('click',e=>{ if(holding && e.target && e.target.id==='goIdleBtn'){ holding=false; } },true);
window.addEventListener('keydown',e=>{
  const w=document.getElementById('pptWin');
  if(!w.classList.contains('show')) return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ slideGo(1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ slideGo(-1); e.preventDefault(); }
  else if(e.key==='Escape'){ hideSlide(); }
  else if(e.key==='f'||e.key==='F'){ document.getElementById('pptFull').click(); }
});

/* ---------- 播放 ---------- */
function playSrc(src,{loop=false,muted=false,onend}={}){
  player.loop=loop; player.muted=muted; player.src=src;
  player.play().catch(()=>{});
  player.onended=()=>{ if(!player.loop) onend&&onend(); };
}
function goIdle(){
  playing=false; hideSlide(); bubble.style.display='none'; speakerTag.style.display='none';
  if(CFG&&CFG.idle) playSrc(CFG.idle,{loop:true,muted:true});
}
/* 有课件的段落：播完停在最后一帧，课件继续留在屏上，等老师下指令才回待机 */
let holding=false;
function holdEntry(){
  playing=false; holding=true;
  try{ player.pause(); }catch(e){}
  if(slideList.length){
    document.getElementById('pptWin').classList.add('show');
    document.getElementById('slideBadge').classList.add('show');
  }
  const h=document.getElementById('holdTip'); if(h) h.style.display='block';
}
function playEntry(item){
  if(!item||!item.video) return;
  playing=true; holding=false; curId=item.id||null;
  const _h=document.getElementById('holdTip'); if(_h) _h.style.display='none';
  const _sl = item.slides && item.slides.length ? item.slides : (item.slide ? [item.slide] : null);
  if(_sl){ showSlides(_sl, (item.title||item.id||'课件')); } else { hideSlide(); }
  playSrc(item.video,{loop:false,muted:false,onend: _sl ? holdEntry : goIdle});
  if(item.subtitle){
    bubble.style.display='block'; bubble.dataset.ch=item.ch||'both';
    whoEl.textContent=(CH_NAME[item.ch]||'')+'：'; replyEl.textContent=item.subtitle;
  }else{bubble.style.display='none';}
  if(item.ch){
    speakerTag.style.display='block'; speakerTag.dataset.ch=item.ch;
    speakerTag.textContent=CH_NAME[item.ch]||'';
  }
}

/* ---------- 语音匹配：按 say 关键词命中最长最多者 ---------- */
/* ---------- 语音匹配（多层打分） ----------
   1) 规范化：去标点/空格、全半角统一、常见同音误识别纠正
   2) 去口癖词（请/吧/我们/一下…）再算一遍，取分高者
   3) 每条口令：精确子串 → 最长公共子串(60%) + 2-gram 相似度(40%)
   4) 返回候选列表（含分数），由调用方决定是否够格、是否需要提示
------------------------------------------------ */
const HOMO={'锤足':'垂足','垂组':'垂足','垂族':'垂足','平形':'平行','凭形':'平行','平行线用':'平行线用',
  '相焦':'相交','直脚':'直角','严长':'延长','廷长':'延长','点平':'点评','输理':'梳理','弥宫':'迷宫','迷供':'迷宫',
  '屏行':'平行','垂足是':'垂足','长方体':'长方体','图形':'图形','天台':'台','猪八盖':'猪八戒','孙悟天':'孙悟空'};
const FILL=['请你','请','吧','啊','呀','呢','哦','我们','大家','一下','开始','现在','那个','然后','好的','来','给我','帮我','我要','你能','可以','麻烦'];
const NUM=[['一号','1号'],['二号','2号'],['三号','3号'],['四号','4号'],['五号','5号'],['一号作品','1号作品']];
function norm(t){
  let s=(t||'').replace(/[\s，。！？、；：,.!?;:'"“”‘’（）()【】\[\]—\-…~]/g,'');
  for(const k in HOMO) s=s.split(k).join(HOMO[k]);
  NUM.forEach(p=>{ s=s.split(p[0]).join(p[1]); });
  return s;
}
function stripFill(s){
  let r=s; FILL.forEach(w=>{r=r.split(w).join('');});
  return r.length>=2 ? r : s;
}
function lcsSub(a,b){                       // 最长公共子串
  const m=a.length,n=b.length; if(!m||!n) return 0;
  let best=0, prev=new Array(n+1).fill(0);
  for(let i=1;i<=m;i++){
    const cur=new Array(n+1).fill(0);
    for(let j=1;j<=n;j++){ if(a[i-1]===b[j-1]){ cur[j]=prev[j-1]+1; if(cur[j]>best) best=cur[j]; } }
    prev=cur;
  }
  return best;
}
function bigramSim(a,b){
  if(a.length<2||b.length<2) return 0;
  const A=new Set(),B=new Set();
  for(let i=0;i<a.length-1;i++) A.add(a.slice(i,i+2));
  for(let i=0;i<b.length-1;i++) B.add(b.slice(i,i+2));
  let hit=0; A.forEach(x=>{ if(B.has(x)) hit++; });
  return (2*hit)/(A.size+B.size);
}
function scoreNode(it,text,bonusKey){
  let best=0, tag='';
  (it.say||[]).forEach(k=>{
    const K=norm(k); if(!K) return;
    const direct=(text.includes(K) || K.includes(text)) && text.length>=3;
    if(direct){ const s=K.length*2.0; if(s>best){ best=s; tag='精确'; } return; }
    const lcs=lcsSub(text,K)/K.length, bg=bigramSim(text,K);
    const s=(0.6*lcs+0.4*bg)*K.length;
    if(s>best){ best=s; tag=`模糊 覆盖${(lcs*100)|0}%/词组${(bg*100)|0}%`; }
  });
  return {score:best, tag};
}
function matchEntry(textRaw){
  const t0=norm(textRaw), t=stripFill(t0);
  const out=[];
  (CFG.items||[]).forEach(it=>{
    const a=scoreNode(it,t0), b=scoreNode(it,t);
    const pick = b.score>a.score ? b : a;
    if(pick.score>0) out.push({it, score:pick.score, tag:pick.tag});
  });
  out.sort((x,y)=>y.score-x.score);
  return out;
}
let curId=null, lastFireAt=0, lastFireId=null;
const MIN_SCORE=3.0;            // 最终结果的最低分
const MIN_SCORE_INTERIM=6.5;    // 中间结果需要更高分才抢先触发
function handleText(text, opts){
  opts=opts||{};
  if(!text) return;
  heardEl.textContent='听到：'+text;
  const c=matchEntry(text);
  const min=opts.interim ? MIN_SCORE_INTERIM : MIN_SCORE;
  if(c.length && c[0].score>=min){
    const top=c[0], second=c[1];
    const now=Date.now();
    // 同一节点 2.5 秒内不重复触发
    if(top.it.id===lastFireId && now-lastFireAt<2500) return;
    if(top.it.id===curId){ micstate.classList.add('live'); mictxt.textContent='已在播放「'+top.it.id+'」'; return; }
    if(second && second.score>top.score*0.9){
      mictxt.textContent='听成「'+text+'」→ 可能是 '+top.it.id+' / '+second.it.id+'，已播 '+top.it.id;
    } else {
      mictxt.textContent='识别：'+top.it.id+' ✓（'+top.tag+'）';
    }
    lastFireId=top.it.id; lastFireAt=now;
    playEntry(top.it);
    return;
  }
  if(/悟空|孙悟空/.test(text)){ playEntry(CFG.fallback.wk); return; }
  if(/八戒|猪八戒/.test(text)){ playEntry(CFG.fallback.bj); return; }
  if(c.length){
    const s=(c[0].it.say||[''])[0];
    mictxt.textContent='没听清（最接近 '+c[0].it.id+'）→ 可以说「'+s+'」';
  } else {
    mictxt.textContent='没听清，请点右下角 ☰ 控制台';
  }
}

/* ---------- 浏览器识别（可替换为扣子ASR）---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  recog=new SR();
  recog.lang='zh-CN';
  recog.continuous=true;
  recog.interimResults=true;      // 边说边识别，响应更快
  recog.maxAlternatives=5;        // 多候选：取命中最好的那个
  let lastHeard='';
  recog.onresult=(e)=>{
    let finalTxt=''; const alts=[];
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      for(let j=0;j<r.length;j++){
        const t=(r[j].transcript||'').trim();
        if(t) alts.push(t);
      }
      if(r.isFinal) finalTxt+=(r[0].transcript||'');
    }
    if(!alts.length) return;
    // 多个候选按序尝试；同一句话只处理一次
    const key=alts[0];
    if(finalTxt.trim()){
      if(finalTxt.trim()===lastHeard) return;
      lastHeard=finalTxt.trim();
      handleText(finalTxt.trim(), {interim:false});
    } else {
      handleText(key, {interim:true});
    }
  };
  recog.onend=()=>{ try{ if(started) recog.start(); }catch(_){} };
  recog.onerror=(e)=>{
    const err=(e&&e.error)||'';
    if(err==='not-allowed'||err==='service-not-allowed'){
      mictxt.textContent='麦克风未授权，请用控制台'; micstate.classList.remove('live'); return;
    }
    mictxt.textContent='识别中断，正在重连…';
    setTimeout(()=>{ try{ if(started) recog.start(); }catch(_){} }, 350);
  };
}

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('start').style.display='none';
  started=true;
  // 开场：先播「空场景→双角色出场」，播完进待机（双角色静止）
  if(CFG&&CFG.entrance){ playing=true; playSrc(CFG.entrance,{loop:false,muted:false,onend:goIdle}); }
  else { goIdle(); }
  if(recog){try{recog.start();micstate.classList.add('live');mictxt.textContent='语音聆听中';}catch(_){}}
  else{document.getElementById('nospeech').style.display='block';document.getElementById('start').style.display='flex';}
};

/* ---------- 控制台：按环节分组 ---------- */
document.getElementById('openPptBtn').onclick=()=>{
  window.open('viewer.html','pptdeck','width=1280,height=780,menubar=no,toolbar=no');
};
document.getElementById('panelToggle').onclick=()=>{
  document.getElementById('panel').classList.toggle('open');
};
document.getElementById('goIdleBtn').onclick=goIdle;

function buildPanel(){
  const scroll=document.getElementById('scroll');
  if(!CFG)return;
  const groups={};
  (CFG.items||[]).forEach(it=>{
    (groups[it.seg]=groups[it.seg]||[]).push(it);
  });
  Object.keys(groups).sort().forEach(s=>{
    const g=document.createElement('div');g.className='seg-grp';
    const lab=document.createElement('div');lab.className='seg-label';
    lab.textContent=(SEG_NAME[s]||('环节'+s))+'（'+groups[s].length+'）';
    g.appendChild(lab);
    groups[s].forEach(it=>{
      const b=document.createElement('button');b.className=it.ch||'both';
      b.innerHTML=(it.id+' '+(CH_NAME[it.ch]||''))+'<span class="k">'+
        ((it.subtitle||'').slice(0,22))+'…</span>';
      b.title='口令：'+(it.say||[]).join(' / ');
      b.onclick=()=>{playEntry(it);};
      g.appendChild(b);
    });
    scroll.appendChild(g);
  });
}
buildPanel();
if(CFG&&CFG.idle){player.src=CFG.idle;}
</script>
