<html lang="zh-CN">
<head>
<script>
/* 旧内核兜底：IE / 360兼容模式 解析不了本页脚本，会只显示一片黑。
   这里用 ES5 检测，给出可读的提示，而不是黑屏。 */
(function () {
  var ok = true;
  try { eval('const __a=1; let __b=2; (()=>__a+__b)(); `t`;'); } catch (e) { ok = false; }
  if (!ok) {
    document.write('<style>html,body{background:#0b1220!important}</style>');
    document.write('<div style="position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#0b1220;color:#eaf2ff;'
      + 'font:20px/1.9 \'Microsoft YaHei\',sans-serif;padding:8vh 8vw;box-sizing:border-box">'
      + '<div style="font-size:34px;font-weight:800;color:#ffd166;margin-bottom:18px">这个浏览器太旧，页面打不开</div>'
      + '<p>本课需要 <b style="color:#9ee6a8">Edge</b> 或 <b style="color:#9ee6a8">Chrome</b>（2020 年以后版本）。</p>'
      + '<p>你现在的浏览器是：<br><b style="color:#8fd8ff;word-break:break-all">' + navigator.userAgent + '</b></p>'
      + '<p style="margin-top:26px">处理办法：<br>① 在电脑上找到 <b>Microsoft Edge</b> 图标，把本页地址复制进去打开；<br>'
      + '② 或把默认浏览器改成 Edge（设置 → 应用 → 默认应用 → Web 浏览器）。</p>'
      + '<p style="color:#9fb2cc;font-size:16px;margin-top:26px">如果已经用 Edge 还是这样，请把这个页面的网址和上面这行浏览器信息发给老师。</p>'
      + '</div>');
  }
})();
</script>

<meta charset="utf-8">
<title>平行与垂直 · 智能体课堂</title>
<link rel="stylesheet" href="style.css?v=20261025l">
</head>
<body>
<div id="stage">
  <div id="bg" style="background-image:url(images/bg.jpg)"></div>
  <video id="video" playsinline preload="auto"></video>
  <canvas id="geo"></canvas>

  <div class="topbar">
    <span class="badge"><b id="pno">01</b> / <span id="pnum">28</span></span>
    <span class="badge" id="ptitle">封面</span>
    <span class="badge" id="pseg">环节一</span>
    <span class="badge ghost" id="modeTag" hidden>几何层</span>
    <a class="badge" href="home.html" style="text-decoration:none;color:#cfe0f5">目录</a>
  </div>

  <div class="micbox">
    <span class="chip" id="micChip"><i class="dot"></i><span id="micTxt">语音待启动</span></span>
    <span class="heard" id="heard" hidden></span>
  </div>

  <div id="tap" hidden>▶ 点一下开始这一页</div>
  <div id="card" class="cardbar" hidden></div>
  <div id="quiz" class="quizbar" hidden></div>
  <div id="note" hidden></div>

  <div class="hint" id="hint">点击画面 / 空格 / → 下一段</div>
  <div class="nav">
    <button id="btnPrev" title="上一段（←）">◀</button>
    <button id="btnReplay" title="重播（R）">重播</button>
    <button id="btnSpin" title="几何层旋转（S）">旋转中</button>
    <button id="btnNext">下一段 ▶</button>
  </div>

  <div id="gate">
    <div class="gatebox">
      <h1>平行与垂直</h1>
      <p>西游数学历险记 · 四年级上册 第五单元</p>
      <button id="startBtn">进入课堂</button>
      <small>提示：进入后动画自动播放；播完点击或按空格继续</small>
    </div>
  </div>
</div>

<script src="nodes.js?v=20261025l"></script>
<script src="cards.js?v=20261025l"></script>
<script src="geom.js?v=20261025l"></script>
<script src="kb.js?v=20261025l"></script>
  <script src="style.js?v=20261025l"></script>
</body>
</html>
