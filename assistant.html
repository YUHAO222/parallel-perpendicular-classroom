<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
/* 旧内核兜底：IE / 360兼容模式 解析不了本页脚本，会只显示一片黑。
   这里用 ES5 检测，给出可读的提示，而不是黑屏。 */
(function () {
  var ok = true;
  try { eval('const __a=1; let __b=2; (()=>__a+__b)(); `t`;'); } catch (e) { ok = false; }
  if (!ok) {
    document.write('<style>html,body{background:#0b1220!important}</style>');
    document.write('<div style="position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#0b1220;color:#eaf2ff;'
      + 'font:20px/1.9 \'Microsoft YaHei\',sans-serif;padding:8vh 8vw;box-sizing:border-box">'
      + '<div style="font-size:34px;font-weight:800;color:#ffd166;margin-bottom:18px">这个浏览器太旧，页面打不开</div>'
      + '<p>本课需要 <b style="color:#9ee6a8">Edge</b> 或 <b style="color:#9ee6a8">Chrome</b>（2020 年以后版本）。</p>'
      + '<p>你现在的浏览器是：<br><b style="color:#8fd8ff;word-break:break-all">' + navigator.userAgent + '</b></p>'
      + '<p style="margin-top:26px">处理办法：<br>① 在电脑上找到 <b>Microsoft Edge</b> 图标，把本页地址复制进去打开；<br>'
      + '② 或把默认浏览器改成 Edge（设置 → 应用 → 默认应用 → Web 浏览器）。</p>'
      + '<p style="color:#9fb2cc;font-size:16px;margin-top:26px">如果已经用 Edge 还是这样，请把这个页面的网址和上面这行浏览器信息发给老师。</p>'
      + '</div>');
  }
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课堂助教 · 猪八戒</title>
<style>
  :root{ --ink:#eaf2ff; --dim:#9fb2cc; --gold:#ffd166; --line:rgba(120,170,255,.22); }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(1200px 700px at 25% 0%,#152a4a 0%,#080e1a 55%,#04060d 100%);
       color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
  .face{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
        font-size:30px;background:linear-gradient(160deg,#f7c86a,#e08a1e);box-shadow:0 8px 22px rgba(0,0,0,.45)}
  .name{font-size:clamp(20px,2vw,28px);font-weight:800;letter-spacing:1px;color:#ffe6a6}
  .name small{display:block;font-size:13px;font-weight:400;letter-spacing:0;color:var(--dim);margin-top:2px}
  header a{margin-left:auto;color:#cfe0f5;text-decoration:none;border:1px solid var(--line);
           padding:8px 16px;border-radius:999px;font-size:14px}
  header a:hover{background:rgba(120,170,255,.12)}
  #log{flex:1;overflow:auto;padding:22px clamp(18px,4vw,64px);display:flex;flex-direction:column;gap:14px}
  .msg{max-width:min(900px,86%);padding:16px 22px;border-radius:18px;font-size:clamp(17px,1.8vw,24px);line-height:1.7}
  .me{align-self:flex-end;background:linear-gradient(180deg,rgba(95,184,255,.28),rgba(95,184,255,.12));
      border:1px solid rgba(95,184,255,.45)}
  .wk{align-self:flex-start;background:rgba(20,32,52,.92);border:1px solid var(--line)}
  .wk b{color:var(--gold)}
  .chips{display:flex;gap:10px;flex-wrap:wrap;padding:0 clamp(18px,4vw,64px) 10px}
  .chips button{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#dbe9ff;
    padding:10px 18px;border-radius:999px;font-size:clamp(14px,1.3vw,18px);cursor:pointer;font-family:inherit}
  .chips button:hover{background:rgba(255,209,102,.18);border-color:rgba(255,209,102,.5)}
  form{display:flex;gap:12px;padding:14px clamp(18px,4vw,64px) 20px;border-top:1px solid var(--line)}
  input{flex:1;background:rgba(10,18,32,.9);border:1px solid var(--line);border-radius:14px;
        padding:16px 20px;color:var(--ink);font-size:clamp(16px,1.7vw,22px);font-family:inherit;outline:none}
  input:focus{border-color:rgba(255,209,102,.6)}
  form button{background:linear-gradient(180deg,#ffe08a,#ffb020);color:#241a05;border:none;
    padding:0 30px;border-radius:14px;font-size:clamp(16px,1.7vw,22px);font-weight:800;cursor:pointer;font-family:inherit}
  form button:disabled{opacity:.45;cursor:default}
  #mic{flex:none;width:clamp(58px,6vw,74px);padding:0;font-size:clamp(20px,2.2vw,28px);
       background:rgba(95,184,255,.16);border:1px solid #3a5f8a;color:#dbe9ff}
  #mic.live{background:rgba(255,90,90,.32);border-color:#ff8a8a;color:#fff;
       animation:micPulse 1s ease-in-out infinite}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,90,.55)}50%{box-shadow:0 0 0 12px rgba(255,90,90,0)}}
</style>
</head>
<body>
<header>
  <div class="face">🐷</div>
  <div class="name">课堂助教 · 猪八戒<small>平行与垂直 · 课前课后随时问</small></div>
  <a href="index.html">回到课堂 ▶</a>
</header>

<div id="log">
  <div class="msg wk">俺老猪在这儿！课前课后想问什么都行 —— <b>平行、垂直、垂足、同一平面</b>，随便挑一个问我。</div>
</div>

<div class="chips" id="chips"></div>

<form id="f">
  <input id="q" placeholder="打字问，或按 🎤 说话问（例：什么是垂足？）" autocomplete="off">
  <button id="mic" type="button" title="按一下说话提问">🎤</button>
  <button id="send" type="submit">问一问</button>
</form>

<script src="kb.js?v=20261024t"></script>
<script>
/* ---------- 本地知识库：不依赖网络，课后直接可用 ---------- */
const KB = [
  { k: ["垂足","交点叫"], a: "两条直线相交成<b>直角</b>时，这个交点才叫<b>垂足</b>。普通的相交，交点只叫交点，不叫垂足。" },
  { k: ["垂直"], a: "两条直线相交成<b>直角</b>，就说这两条直线互相垂直，记作 <b>a⊥b</b>。垂直和摆放方向无关，斜着放只要成直角也算垂直。" },
  { k: ["平行"], a: "在<b>同一个平面内</b>、<b>不相交</b>的两条直线叫平行线，记作 <b>a∥b</b>。判断平行要看两点：同一平面内 + 延长后也不相交。" },
  { k: ["同一平面","同一个平面","异面"], a: "两条直线不在同一个平面上（比如立方体的一条在前面、一条在上面），它们不相交，但<b>不是平行线</b>，叫异面。" },
  { k: ["不相交"], a: "不相交<b>不一定</b>平行。还要看是不是在<b>同一平面内</b>：不同平面上的两条直线也可以不相交，但那是异面。" },
  { k: ["垂直符号","⊥"], a: "垂直记作 <b>a⊥b</b>，读作「a 垂直于 b」；平行记作 <b>a∥b</b>，读作「a 平行于 b」。" },
  { k: ["延长","延长后"], a: "判断时要<b>延长再看</b>：有些线看着不相交，延长后就相交了，那就不是平行。" },
  { k: ["两种关系","几种关系","位置关系"], a: "在<b>同一个平面内</b>，两条直线的位置关系只有两种：<b>相交</b>（其中相交成直角就是垂直）和<b>平行</b>。" },
  { k: ["直线","端点","度量"], a: "直线可以向<b>两端无限延伸</b>。" },
  { k: ["正方形","长方形","黑板","课桌","例子"], a: "生活里的平行：黑板上下边框、课桌对边、铁轨、斑马线；垂直：门窗框的横竖框、十字路口。" }
];

const log = document.getElementById('log'), form = document.getElementById('f'),
      input = document.getElementById('q'), send = document.getElementById('send'),
      chips = document.getElementById('chips');

const CHIPS = ["什么是垂足？","不相交一定平行吗？","平行怎么记？","同一平面内两条直线有几种关系？","举几个生活中的例子"];
CHIPS.forEach(t => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = t;
  b.onclick = () => ask(t);
  chips.appendChild(b);
});

function add(cls, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.innerHTML = html;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

function answer(text) {
  const t = (text || '').replace(/\s/g, '');
  // ① 先查《智能体回复》38 条标准答复
  if (typeof ASK_MATCH === 'function') {
    const h = ASK_MATCH(t);
    if (h) { window.__kp = h.entry.kp; return h.entry.a; }
  }
  window.__kp = '';
  let hit = null;
  for (const item of KB) {
    if (item.k.some(k => t.includes(k))) { hit = item; break; }
  }
  if (hit) return hit.a;
  if (/你好|在吗|嗨/.test(t)) return '俺老猪在！想问平行、垂直还是垂足？';
  if (/你叫什么|你是谁|名字/.test(t)) return '俺老猪是《平行与垂直》这节课的课堂助教，课前课后的疑问都能问我。';
  if (/谢谢|谢了/.test(t)) return '不客气！课后还想到什么问题，随时来问俺老猪。';
  return '这个俺老猪不答——只讲《平行与垂直》这节课的。你试试问：<b>什么是垂足</b>、<b>不相交一定平行吗</b>、<b>同一平面内两条直线有几种关系</b>。';
}

let busy = false;
function ask(text) {
  if (busy) return;
  const q = (text || input.value || '').trim();
  if (!q) return;
  input.value = '';
  add('me', q);
  busy = true; send.disabled = true;
  const thinking = add('wk', '……');
  setTimeout(() => {
    thinking.innerHTML = answer(q);
    log.scrollTop = log.scrollHeight;
    busy = false; send.disabled = false;
    speak(thinking.textContent);
  }, 260);
}

/* 有语音就用浏览器朗读（没有就安静） */
function speak(txt) {
  try {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(txt.replace(/[「」]/g, ''));
    u.lang = 'zh-CN'; u.rate = 0.98; u.pitch = 0.95;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

form.onsubmit = e => { e.preventDefault(); ask(); };

/* 从课堂带问题过来：assistant.html?q=什么是垂足 */
(function () {
  const q = new URLSearchParams(location.search).get('q');
  if (q) { setTimeout(() => ask(q), 120); }
  else { try { input.focus(); } catch (e) {} }
})();

/* ---------------- 语音提问（Web Speech API，说完自动提问） ---------------- */
const micBtn = document.getElementById('mic');
let recog = null, listening = false;

function setListening(on) {
  listening = on;
  micBtn.classList.toggle('live', on);
  micBtn.textContent = on ? '■' : '🎤';
  micBtn.title = on ? '再点一下停止' : '按一下说话提问';
}

function micSay(html) { add('wk', html); }

function startRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micSay('这个浏览器不支持语音输入，请用 Chrome 或 Edge 打开本页（电脑或安卓都行）。');
    return;
  }
  if (!/^https?:$/.test(location.protocol)) {
    micSay('麦克风只能在 https 或 localhost 下使用，现在这个地址不行。');
    return;
  }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  try { if (recog) recog.abort(); } catch (e) {}

  const r = new SR();
  recog = r;
  r.lang = 'zh-CN';
  r.continuous = false;
  r.interimResults = true;
  r.maxAlternatives = 3;
  setListening(true);

  r.onresult = e => {
    let fin = '', itm = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const s = e.results[i][0].transcript;
      if (e.results[i].isFinal) fin += s; else itm += s;
    }
    input.value = (fin || itm).trim();
    if (fin.trim()) { try { r.stop(); } catch (e) {} }
  };
  r.onerror = e => {
    const m = {
      'not-allowed': '麦克风没被允许：点地址栏左边的 🔒 → 把「麦克风」改成「允许」，再点 🎤。',
      'service-not-allowed': '浏览器禁用了语音识别，请用 Chrome/Edge，并在设置里允许麦克风。',
      'no-speech': '没听到声音，再点一次 🎤 说一遍。',
      'audio-capture': '没找到麦克风设备，检查一下耳机/麦克风有没有插好。',
      'network': '语音识别要联网（Chrome 的识别在云端），检查网络后再试。',
      'aborted': null
    }[e.error];
    if (m) micSay(m);
  };
  r.onend = () => {
    setListening(false);
    const q = input.value.trim();
    if (q) ask(q);         // 说完自动提问
  };
  try { r.start(); } catch (e) { setListening(false); micSay('麦克风打不开：' + e.message); }
}

micBtn.onclick = () => {
  if (listening) { try { recog && recog.stop(); } catch (e) {} setListening(false); return; }
  startRec();
};

</script>
</body>
</html>
